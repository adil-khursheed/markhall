name: markhall

# POSTGRES_PASSWORD and PAYLOAD_SECRET must be set in .env or the shell.

x-app: &app
  image: markhall-app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    sandbox:
      condition: service_healthy
  networks:
    - backend
    - sandboxnet

services:
  web:
    <<: *app
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-markhall}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-markhall}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SANDBOX_URL: http://sandbox:8000
      REDIS_URL: redis://redis:6379
      JOBS_AUTORUN: 'false'
      PORT: '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - uploads:/app/uploads

  worker:
    <<: *app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-markhall}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-markhall}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SANDBOX_URL: http://sandbox:8000
      REDIS_URL: redis://redis:6379
      JOBS_AUTORUN: 'true'
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - uploads:/app/uploads

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-markhall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-markhall}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-markhall} -d ${POSTGRES_DB:-markhall}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '10001:10001'
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sandboxnet
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata17:
  uploads:

networks:
  backend:
  sandboxnet:
    internal: true
