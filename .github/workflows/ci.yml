name: CI

# Required repository secrets:
# CI_POSTGRES_PASSWORD (URL-safe random value), PAYLOAD_SECRET, LLM_API_KEY
# Optional e2e overrides: E2E_TEST_EMAIL, E2E_TEST_PASSWORD

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: markhall
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: markhall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markhall -d markhall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://markhall:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/markhall
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm migrate

      - run: pnpm test:int

      - name: Start sandbox for the golden evaluation
        run: |
          docker build -t markhall-sandbox ./sandbox
          docker network create --internal sandboxnet
          docker run -d --name sandbox --network sandboxnet --read-only --tmpfs /tmp:size=64m --pids-limit 64 --memory 512m --cpus 1 --user 10001:10001 -e SANDBOX_WORKERS=2 -e SANDBOX_QUEUE_LIMIT=8 -e SANDBOX_MEMORY_MB=192 -e SANDBOX_RATE_LIMIT=60 markhall-sandbox
          SANDBOX_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sandbox)
          docker run -d --name sandbox-proxy -p 127.0.0.1:8000:8000 alpine/socat tcp-listen:8000,fork,reuseaddr tcp:$SANDBOX_IP:8000
          docker network connect sandboxnet sandbox-proxy
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          echo "Sandbox did not become healthy" >&2
          exit 1

      - run: pnpm eval:golden
        env:
          SANDBOX_URL: http://127.0.0.1:8000

  sandbox:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t markhall-sandbox ./sandbox

      - run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m
          --pids-limit 64 --memory 512m --user 10001:10001
          -e SANDBOX_TEST_ISOLATED=1 markhall-sandbox
          python -m unittest -v test_app

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: markhall
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: markhall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markhall -d markhall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://markhall:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/markhall
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm migrate

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
